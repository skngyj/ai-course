<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <style>
    body {
      font-family: "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 40px 16px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }
    h1 { margin-top: 0; font-size: 24px; }
    .add-form { display: flex; gap: 8px; margin-bottom: 20px; }
    .add-form input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #3b82f6;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button.delete { background: #ef4444; }
    button.toggle { background: #10b981; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .status { width: 20px; text-align: center; }
    .info { flex: 1; }
    .title { font-size: 16px; }
    li.done .title { text-decoration: line-through; color: #999; }
    .created { font-size: 12px; color: #888; }
    form.inline { margin: 0; }
    .empty { color: #888; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>할 일 목록</h1>

    <form class="add-form" method="post" action="{{ url_for('add_todo') }}">
      <input type="text" name="title" placeholder="할 일을 입력하세요" required autofocus>
      <button type="submit">추가</button>
    </form>

    {% if todos %}
    <ul>
      {% for todo in todos %}
      <li class="{{ 'done' if todo['done'] else '' }}">
        <span class="status">{{ '✔' if todo['done'] else '○' }}</span>
        <div class="info">
          <div class="title">{{ todo['title'] }}</div>
          <div class="created">{{ todo['created_at'] }}</div>
        </div>
        <form class="inline" method="post" action="{{ url_for('toggle_todo', todo_id=todo['id']) }}">
          <button type="submit" class="toggle">{{ '완료 해제' if todo['done'] else '완료' }}</button>
        </form>
        <form class="inline" method="post" action="{{ url_for('delete_todo', todo_id=todo['id']) }}">
          <button type="submit" class="delete">삭제</button>
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="empty">할 일이 없습니다.</p>
    {% endif %}
  </div>
</body>
</html>
